# =============================================================================
# render.yaml — ZIMRA POS Platform · Render Blueprint (Free Tier Compatible)
# =============================================================================

services:

  # ── 1. API & Sync Worker Web Service ──────────────────────────────────────
  - type: web
    name: zimra-pos-api
    runtime: node
    region: frankfurt
    plan: free              

    rootDir: .
    # Runs migrations and builds code in a single build step
    buildCommand: npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js

    healthCheckPath: /api/health

    # Auto-deploy every push to main branch
    autoDeploy: true
    branch: main

    envVars:
      # ── Database (Supabase) ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      # ── App config ────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3003"

      # ── ZIMRA FDMS ────────────────────────────────────────────────────────
      - key: ZIMRA_ENVIRONMENT
        value: development      # Set to "development" for sandbox testing

      - key: ZIMRA_TIMEOUT_MS
        value: "30000"

      # ── Background Worker Tuning (In-Process) ────────────────────────────
      - key: WORKER_POLL_INTERVAL_MS
        value: "10000"         # Poll sync queue every 10 seconds

      - key: WORKER_MAX_CONCURRENT
        value: "3"             # Process up to 3 ZIMRA submissions in parallel

      # ── Device key encryption (generate with: openssl rand -hex 32) ──────
      - key: DEVICE_KEY_SECRET
        sync: false

      - key: DEVICE_KEY_SALT
        sync: false

      # ── Subscription / billing ────────────────────────────────────────────
      - key: PAYNOW_INTEGRATION_ID
        sync: false

      - key: PAYNOW_INTEGRATION_KEY
        sync: false

      - key: ECOCASH_API_URL
        value: https://api.econet.co.zw/apis/ecocash/v1/transactions

      - key: ECOCASH_MERCHANT_CODE
        sync: false

      - key: ECOCASH_MERCHANT_PIN
        sync: false

      - key: ECOCASH_MERCHANT_NUMBER
        sync: false

      - key: ECOCASH_API_TOKEN
        sync: false

      - key: ECOCASH_WEBHOOK_SECRET
        sync: false

      - key: INNBUCKS_API_URL
        value: https://api.innbucks.co.zw/v1/payments/initiate

      - key: INNBUCKS_MERCHANT_ID
        sync: false

      - key: INNBUCKS_API_KEY
        sync: false

      - key: INNBUCKS_WEBHOOK_SECRET
        sync: false

      - key: ZIPIT_BENEFICIARY_ACCOUNT
        sync: false

      - key: ZIPIT_BENEFICIARY_BANK
        sync: false

      - key: ZIPIT_BENEFICIARY_NAME
        sync: false

      - key: ZIPIT_WEBHOOK_API_KEY
        sync: false

      # ── Auth / JWT ────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "8h"

      # ── App URLs ──────────────────────────────────────────────────────────
      - key: APP_BASE_URL
        sync: false