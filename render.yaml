# =============================================================================
# render.yaml — ZIMRA POS Platform · Render Blueprint (Free Tier)
# =============================================================================
# Single web service — the sync worker runs in-process inside the API.
# Free plan: 512MB RAM, shared CPU, spins down after 15 min inactivity.
#
# To deploy:
#   1. Push this file to your repo root
#   2. Render Dashboard → New → Blueprint → select your repo
#   3. Fill in every "sync: false" variable when prompted
#   4. Click Apply
# =============================================================================

services:

  - type: web
    name: zimra-pos-api
    runtime: node
    region: frankfurt
    plan: free                 # $0/mo — spins down after 15 min inactivity

    rootDir: .
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server.js

    healthCheckPath: /api/health
    autoDeploy: true
    branch: main

    # Give in-flight ZIMRA API calls up to 30 s to complete on redeploy.
    # Render kills the process with SIGKILL after this window.
    maxShutdownDelaySeconds: 30

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3003"

      - key: ZIMRA_ENVIRONMENT
        value: development

      - key: ZIMRA_TIMEOUT_MS
        value: "30000"

      - key: DEVICE_KEY_SECRET
        sync: false

      - key: DEVICE_KEY_SALT
        sync: false

      - key: PAYNOW_INTEGRATION_ID
        sync: false

      - key: PAYNOW_INTEGRATION_KEY
        sync: false

      - key: ECOCASH_API_URL
        value: https://api.econet.co.zw/apis/ecocash/v1/transactions

      - key: ECOCASH_MERCHANT_CODE
        sync: false

      - key: ECOCASH_MERCHANT_PIN
        sync: false

      - key: ECOCASH_MERCHANT_NUMBER
        sync: false

      - key: ECOCASH_API_TOKEN
        sync: false

      - key: ECOCASH_WEBHOOK_SECRET
        sync: false

      - key: INNBUCKS_API_URL
        value: https://api.innbucks.co.zw/v1/payments/initiate

      - key: INNBUCKS_MERCHANT_ID
        sync: false

      - key: INNBUCKS_API_KEY
        sync: false

      - key: INNBUCKS_WEBHOOK_SECRET
        sync: false

      - key: ZIPIT_BENEFICIARY_ACCOUNT
        sync: false

      - key: ZIPIT_BENEFICIARY_BANK
        sync: false

      - key: ZIPIT_BENEFICIARY_NAME
        sync: false

      - key: ZIPIT_WEBHOOK_API_KEY
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "8h"

      - key: APP_BASE_URL
        sync: false

      # Worker config — tuned for free-tier memory limits
      - key: WORKER_POLL_INTERVAL_MS
        value: "15000"         # 15 s — slightly gentler than $7 plan

      - key: WORKER_MAX_CONCURRENT
        value: "2"             # 2 concurrent ZIMRA ops — safe for 512 MB RAM