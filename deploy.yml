# =============================================================================
# GitHub Actions — CI/CD Pipeline
# .github/workflows/deploy.yml
# =============================================================================
# Triggers on push to main.
#
# Jobs:
#   1. validate  — TypeScript type-check + Prisma schema validation
#   2. deploy-api     — Deploy backend to Render (auto via git push if using
#                       Render's GitHub integration — this job is for visibility)
#   3. deploy-frontend — Deploy Next.js to Vercel
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN          — Vercel personal access token
#   VERCEL_ORG_ID         — From .vercel/project.json after first `vercel link`
#   VERCEL_PROJECT_ID     — From .vercel/project.json after first `vercel link`
#   RENDER_DEPLOY_HOOK    — From Render Dashboard → service → Settings → Deploy Hook
# =============================================================================

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Validate ─────────────────────────────────────────────────────────────
  validate:
    name: Type-check & Validate Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type-check (API)
        run: npx tsc --noEmit

      - name: TypeScript type-check (Next.js)
        run: npx tsc --noEmit --project tsconfig.frontend.json
        continue-on-error: true  # Frontend tsconfig is optional if using Next.js built-in check

      - name: Build (smoke test)
        run: npm run build


  # ── 2. Deploy API to Render ──────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Render
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Trigger Render deploy hook
        # Render auto-deploys on git push if GitHub integration is connected.
        # This step provides an explicit trigger + deploy status in GitHub UI.
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}")
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "Render deploy hook returned HTTP $response"
            exit 1
          fi
          echo "Render deploy triggered successfully (HTTP $response)"

      - name: Wait for Render health check
        # Poll the API health endpoint until it responds 200 or timeout (5 min)
        run: |
          echo "Waiting for API to become healthy..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "https://zimra-pos-api.onrender.com/api/health" || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy within 5 minutes"
          exit 1


  # ── 3. Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployed to: ${{ steps.deploy.outputs.deployment_url }}`
            })
